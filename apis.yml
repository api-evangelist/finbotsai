name: Finbots.AI
description: 'Finbots.AI (finbots.ai) is a Singapore-headquartered fintech offering
  CreditX, a no-code, AI-powered credit risk platform that lets banks and lenders build,
  validate, and deploy application, behavioural, and collection scorecards in hours
  instead of months. Its proprietary, explainable machine-learning models power real-time
  lending decisions in under 0.03 seconds, and the platform adds a Decision Engine
  (business rules), propensity modelling, and managed data services. Backed by Accel,
  finbots.ai serves retail banking, SME lending, and credit-card clients across APAC
  and MEA markets, and was among the first fintechs to complete Singapore''s AI Verify
  AI-governance testing framework. No public self-service developer API is published;
  API integration is enterprise and sales-gated.'
